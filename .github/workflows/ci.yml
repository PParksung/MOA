# PR / push 시 테스트 자동 실행 (이슈 #36)
# - Testcontainers 가 MySQL 컨테이너를 띄우므로 Docker 가 있는 ubuntu 러너 사용
# - 지금은 security-server 만. 다른 서버에 테스트가 생기면 matrix 에 추가
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    name: test (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [security-server]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4   # Gradle 의존성 캐시

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.server }}
          path: ${{ matrix.server }}/build/reports/tests/test
