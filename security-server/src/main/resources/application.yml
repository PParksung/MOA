spring:
  application:
    name: security-server

  datasource:
    url: jdbc:mysql://localhost:3306/moa_security?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false            # 트랜잭션 밖(컨트롤러)에서 지연 로딩 금지 — 커넥션을 요청 내내 붙잡지 않는다
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    locale: en                      # 유효성 메시지 등 서버 생성 메시지는 영어로 (API 규칙: message 는 영어)
    locale-resolver: fixed          # Accept-Language 헤더에 따라 바뀌지 않게 고정

  jackson:
    property-naming-strategy: SNAKE_CASE   # API 규칙: 요청/응답 필드명 snake_case (DTO 는 camelCase 로 작성)
    default-property-inclusion: non_null

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 300000      # 5분 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

# AES-256-GCM: IV(nonce)는 암호화할 때마다 랜덤 생성해 암호문에 포함하므로 고정 IV 설정을 두지 않는다
aes:
  key: ${AES_KEY}

exchange:
  server-url: ${EXCHANGE_SERVER_URL:http://localhost:8081}
